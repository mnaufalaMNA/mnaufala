<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="60%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="catFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>

    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="130" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" filter="url(#neonGlow)"/>

  <!-- Iconic Cat Silhouette Vector -->
  <g transform="translate(40, 40) scale(3.6)" fill="url(#catFoil)">
    <!-- Cat Head & Ears -->
    <path d="M 60 17 C 52 17, 46 19.5, 42 24 C 39.5 21.5, 35 17.5, 32 17.5 C 27.5 17.5, 26 23, 29 29.5 C 24.5 33.5, 22.5 39.5, 22.5 45.5 C 22.5 59.5, 35.5 71, 60 71 C 84.5 71, 97.5 59.5, 97.5 45.5 C 97.5 39.5, 95.5 33.5, 91 29.5 C 94 23, 92.5 17.5, 88 17.5 C 85 17.5, 80.5 21.5, 78 24 C 74 19.5, 68 17, 60 17 Z"/>
    <!-- Whiskers Left -->
    <path d="M 25 41 C 18 39.5, 12 37.5, 7 36 C 5.5 35.5, 4.5 37.5, 6 38.5 C 11 41, 18 43, 24 44 Z M 23 48 C 16 48, 10 47.5, 5 47 C 3.5 47, 3.5 49, 5 49.5 C 10 50, 16 50, 23 49.5 Z M 25 55 C 18 57, 12 59.5, 7 61 C 5.5 61.5, 6.5 63.5, 8 63 C 13 61.5, 19 59, 26 56.5 Z"/>
    <!-- Whiskers Right -->
    <path d="M 95 41 C 102 39.5, 108 37.5, 113 36 C 114.5 35.5, 115.5 37.5, 114 38.5 C 109 41, 102 43, 96 44 Z M 97 48 C 104 48, 110 47.5, 115 47 C 116.5 47, 116.5 49, 115 49.5 C 110 50, 104 50, 97 49.5 Z M 95 55 C 102 57, 108 59.5, 113 61 C 114.5 61.5, 113.5 63.5, 112 63 C 107 61.5, 101 59, 94 56.5 Z"/>
    <!-- Cat Body & Tail -->
    <path d="M 60 76.5 C 43 76.5, 29.5 90, 29.5 106.5 C 29.5 113, 31.5 118, 36 121 C 39.5 123, 44 122, 45.5 118 C 47 112.5, 45 107, 40.5 104 C 38 102.5, 40.5 98.5, 44 98.5 C 48.5 98.5, 54 100.5, 56.5 102.5 C 60 106, 60 110.5, 59 114 C 58 117.5, 55.5 121, 51.5 123 C 54.5 124, 57.5 124.5, 60 124.5 C 77.5 124.5, 91.5 110.5, 91.5 93.5 C 91.5 76.5, 77.5 76.5, 60 76.5 Z"/>
  </g>

  <!-- Official Verified Golden Yellow Badge with Checkmark -->
  <g transform="translate(360, 360)">
    <circle cx="50" cy="50" r="48" fill="url(#goldBadge)" stroke="#09090b" stroke-width="8"/>
    <path d="M36 50 L46 60 L66 40" fill="none" stroke="#09090b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
