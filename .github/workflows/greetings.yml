name: Welcome Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Send Welcome Message
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Halo @${{ github.actor }}! Terima kasih telah membuka issue di portal ekosistem resmi M Naufal Amrullah. Kami akan segera meninjaunya.'
          pr-message: 'Halo @${{ github.actor }}! Terima kasih atas kontribusi Pull Request Anda ke ekosistem M Naufal Amrullah.'
