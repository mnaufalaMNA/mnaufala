name: Google Search Console Sitemap & SEO Ping

on:
  push:
    branches:
      - mnaufala
      - mnaufala_mna
      - mnaufalamna
      - main
  schedule:
    # Berjalan otomatis setiap hari Senin jam 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo_ping:
    name: SEO & Sitemap Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify SEO Files (Sitemap & Robots)
        run: |
          echo "Memeriksa ketersediaan sitemap.xml dan robots.txt..."
          test -f sitemap.xml || (echo "Error: sitemap.xml tidak ditemukan!" && exit 1)
          test -f robots.txt || (echo "Error: robots.txt tidak ditemukan!" && exit 1)
          echo "✅ Semua berkas SEO (sitemap.xml & robots.txt) valid!"

      - name: Ping Search Engines (Google & Bing)
        run: |
          echo "Mengirim notifikasi perbaruan sitemap ke Search Engines..."
          curl -s -I "https://www.google.com/ping?sitemap=https://mnaufalamna.github.io/mnaufala/sitemap.xml" || true
          curl -s -I "https://www.bing.com/ping?sitemap=https://mnaufalamna.github.io/mnaufala/sitemap.xml" || true
          echo "✅ Notifikasi perayapan berhasil dikirim ke Google & Bing!"
