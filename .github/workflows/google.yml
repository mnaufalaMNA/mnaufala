name: Google & Bing Search Indexing Ping

on:
  push:
    branches:
      - mnaufala
      - main
  workflow_dispatch:

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Ping Google Sitemaps
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://mnaufalamna.github.io/mnaufala/sitemap.xml" || true
      - name: Ping Bing Sitemaps
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://mnaufalamna.github.io/mnaufala/sitemap.xml" || true
