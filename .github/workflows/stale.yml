name: Mark Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'Isu ini ditandai sebagai stale karena tidak ada aktivitas selama 60 hari.'
          stale-pr-message: 'Pull Request ini ditandai sebagai stale karena tidak ada aktivitas selama 60 hari.'
          days-before-stale: 60
          days-before-close: 7
