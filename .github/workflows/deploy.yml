name: Deploy Ecosystem to GitHub Pages & Production

on:
  push:
    branches:
      - mnaufala
      - mnaufala_mna
      - mnaufalamna
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Core Files
        run: |
          echo "Memverifikasi integritas berkas portal..."
          test -f index.html || exit 1
          test -f manifest.json || exit 1
          test -f sitemap.xml || exit 1
          test -f robots.txt || exit 1
          echo "Semua berkas inti lengkap dan valid!"

      - name: Setup GitHub Pages Engine
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages Live
        id: deployment
        uses: actions/deploy-pages@v4
