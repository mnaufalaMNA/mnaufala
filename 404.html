<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Pengalihan Otomatis Instan 0 Detik -->
  <meta http-equiv="refresh" content="0; url=https://mnaufalamna.github.io/mnaufala/">
  <link rel="canonical" href="https://mnaufalamna.github.io/mnaufala/">
  
  <title>M Naufal Amrullah - Mengalihkan ke Beranda...</title>
  
  <!-- PWA & Theme Color -->
  <meta name="theme-color" content="#09090b">

  <!-- Script Pengalihan Cepat Klien -->
  <script>
    window.location.replace("https://mnaufalamna.github.io/mnaufala/");
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(18, 18, 26, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(168, 85, 247, 0.2);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>✨ Mengalihkan ke Ekosistem Resmi...</h2>
    <p>M Naufal Amrullah Official Portal</p>
    <a href="https://mnaufalamna.github.io/mnaufala/" class="btn">Buka Beranda Sekarang ➔</a>
  </div>
</body>
</html>
